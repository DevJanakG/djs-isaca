<title id="newstar-title">The Hunt — fractured thorn seal</title>
<desc id="newstar-description">An aggressive, hand-scored ritual seal: a downward-pointing interlaced star, broken circular wards, angular invented sigils, and uneven spear-like radial cuts.</desc>
